name: OpenRecord CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # Use Swift and the SDK from the same Xcode installation rather than
      # whichever Command Line Tools happen to be selected on the runner.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package Apple Silicon app with ad-hoc signing
        env:
          CONFIGURATION: release
          CODESIGN_IDENTITY: '-'
          ARCH: arm64
        run: ./scripts/package-app.sh

      - name: Verify packaged app
        run: |
          test -x dist/OpenRecord.app/Contents/MacOS/OpenRecord
          codesign --verify --deep --strict --verbose=2 dist/OpenRecord.app

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: OpenRecord-macos
          path: dist/OpenRecord.app
          if-no-files-found: error
