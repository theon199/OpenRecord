name: OpenRecord CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package Apple Silicon app with ad-hoc signing
        env:
          CONFIGURATION: release
          CODESIGN_IDENTITY: '-'
          ARCH: arm64
        run: ./scripts/package-app.sh

      - name: Verify packaged app
        run: ./scripts/verify-v3-release.sh --static-only

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: OpenRecord-macos
          path: dist/OpenRecord.app
          if-no-files-found: error

      - name: Upload local automation CLI
        uses: actions/upload-artifact@v4
        with:
          name: openrecord-cli-macos-arm64
          path: .build/arm64-apple-macosx/release/openrecord-cli
          if-no-files-found: error
